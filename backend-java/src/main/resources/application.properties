# ====================================================================
# IdentityShield Spring Boot Configuration
# ====================================================================

server.port=8080

# 1. MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/identityshield?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 3. Multipart File Upload Settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# 4. Storage & Integration Settings
identityshield.upload.dir=./uploads
# Python FastAPI CNN ML Microservice URL (configured on port 8001 to avoid container port collisions)
identityshield.ml.service-url=http://localhost:8001/screen
identityshield.ml.health-url=http://localhost:8001/health

# 5. Logging Configuration
logging.level.com.identityshield=INFO
logging.level.org.springframework.web=INFO
